:root {
  --bg: #f4f1ea; --surface: #fffdf8; --ink: #1c2422; --muted: #64706c; --line: #e2ddd1;
  --pri: #1f5f5b; --pri-ink: #fff; --pri-soft: #e3efed; --accent: #c8862a;
  --ok: #15803d; --bad: #b91c1c; --warn: #b45309; --radius: 14px;
}
* { box-sizing: border-box; font-synthesis: none; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: 'Naskh', 'Noto Naskh Arabic', Tahoma, sans-serif; font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
header { background: #123f3c; color: #fff; padding: 12px 16px 0; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 10px #0002; }
#brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
#brand b { font-size: 22px; letter-spacing: .5px; }
#brand span { font-size: 13px; opacity: .75; }
#tabs { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; }
#tabs button { background: none; border: 0; color: #fff; opacity: .7; padding: 8px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
#tabs button.on { opacity: 1; border-bottom-color: var(--accent); font-weight: 700; }
main { max-width: 980px; margin: 0 auto; padding: 16px 16px 80px; }
h2 { font-size: 20px; margin: 0; flex: 1; }
h3 { font-size: 17px; margin: 0 0 6px; }
.bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.bar h2, .bar h3 { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-height: 42px; text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--pri); color: var(--pri-ink); border-color: var(--pri); font-weight: 700; }
.btn.danger { color: var(--bad); border-color: #f1c9c9; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { min-height: 32px; padding: 4px 10px; }
.btn.on { background: #fde68a; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.card b { font-size: 17px; }
.card span { color: var(--muted); font-size: 14px; }
.card:hover { border-color: var(--pri); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; border: 2px dashed var(--line); border-radius: var(--radius); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.form label, label.wide { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.form .wide { grid-column: 1 / -1; }
.form label.radio { grid-column: 1 / -1;  flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 16px; }
input, select, textarea { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: #fff; min-height: 42px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--pri); outline-offset: -1px; }
textarea { min-height: 80px; }
input[type=radio], input[type=checkbox] { width: 20px; height: 20px; min-height: 0; padding: 0; flex: none; accent-color: var(--pri); }
input.mini { width: 90px; min-height: 34px; padding: 4px 8px; }
.title-input { flex: 1; font-size: 20px; font-weight: 700; }
small { color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.alert { background: #fef3c7; color: #78350f; border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }
.warn { color: var(--warn); font-size: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.meta span { background: var(--pri-soft); color: var(--pri); border-radius: 99px; padding: 2px 12px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.vtabs { display: flex; gap: 4px; }
.vtabs button, .seg button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 12px; cursor: pointer; }
.vtabs button.on, .seg button.on { background: var(--pri); color: #fff; border-color: var(--pri); }
.seg { display: flex; gap: 4px; }
.keygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 18px; }
.krow { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px dashed #eee; }
.qn { min-width: 30px; font-weight: 700; color: var(--muted); text-align: center; }
.bub { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #9aa5a1; background: #fff; cursor: pointer; padding: 0; font-weight: 700; }
.bub.on { background: var(--pri); color: #fff; border-color: var(--pri); }
.keyfoot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.map { margin-top: 14px; }
.big-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 8px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.act i { font-style: normal; font-size: 28px; }
.act small { font-weight: 400; }
.act.main { background: var(--pri); color: #fff; border-color: var(--pri); }
.act.main small { color: #fffc; }
.statrow, .pstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; }
.stat span { font-size: 13px; color: var(--muted); }
.stat b { font-size: 19px; }
.tools { justify-content: space-between; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { background: #eef4f3; color: var(--pri); text-align: start; padding: 8px 10px; font-size: 14px; white-space: nowrap; }
.tbl td { padding: 6px 10px; border-top: 1px solid var(--line); }
.tbl td input { min-height: 34px; padding: 4px 8px; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover { background: #f6faf9; }
.tbl tr.fail td:nth-last-child(-n+2) { color: var(--bad); }
.tbl tr.missing td { color: var(--muted); font-style: italic; }
.dot { color: var(--warn); font-size: 12px; }
.pbar { position: relative; background: #eee; border-radius: 6px; height: 20px; min-width: 90px; overflow: hidden; }
.pbar i { position: absolute; inset-block: 0; inset-inline-start: 0; background: #9fd3cb; }
.pbar span { position: relative; padding: 0 6px; font-size: 13px; font-weight: 700; }
.ana { min-width: 640px; }
.ana td { white-space: nowrap; }
.dist span { display: inline-block; margin-inline-end: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.dist span.k { color: var(--ok); }
.dist b { color: var(--ink); }
.dist span.k b { color: var(--ok); }
.ana tr.n-nNegDisc td:last-child { color: var(--bad); font-weight: 700; }
.ana tr.n-nVeryHard td:last-child, .ana tr.n-nLowDisc td:last-child { color: var(--warn); }
.ana tr.n-nGood td:last-child { color: var(--ok); }
/* scanner */
.scanner { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 3/4; max-height: 70vh; margin: 0 auto; width: 100%; }
.scanner video, .scanner canvas#ov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.scan-status { position: absolute; inset-inline: 12px; top: 12px; text-align: center; background: #000a; color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 15px; }
.scan-status.ok { background: #15803dcc; }
.scan-status.bad { background: #b91c1ccc; }
.scan-status.warn { background: #b45309cc; }

<body>
<header><div id="brand"></div><nav id="tabs"></nav></header>
<main id="main"></main>
<div id="print"></div>
<div id="toasts"></div>
<script>
// ===== OMR engine: sheet layout + detection + reading (pure JS, no deps) =====
const OMR = (() => {
  const SHEET_W = 210, SHEET_H = 297;
  const MK = 9; // marker size (mm)
  const MARKERS = [[14, 14], [196, 14], [196, 283], [14, 283]]; // TL, TR, BR, BL centers
  const ORIENT_BAR = { x: 80, y: 10, w: 50, h: 8 };
  const ID_DIGITS = 4;

  const TEMPLATES = {
    20:  { cols: 2, rows: 10, top: 108, pitch: 15.5, r: 3.1, cp: 9.0, lab: 11, gap: 14 },
    50:  { cols: 2, rows: 25, top: 102, pitch: 6.9, r: 2.5, cp: 7.4, lab: 9, gap: 14 },
    100: { cols: 4, rows: 25, top: 102, pitch: 6.9, r: 2.25, cp: 6.0, lab: 7.5, gap: 4.5 },
  };
  function templateFor(nQ) { return nQ <= 20 ? 20 : nQ <= 50 ? 50 : 100; }

  // Layout is RTL: first column on the right, choice 0 on the right of its row.
  // Quarter sheet (4 per A4): same 210x297 unit frame, printed at 50% (A6). Max 30 questions.
  const QMAX = 30;
  function layoutQuarter(nQ, nChoices) {
    const T = nQ <= 20 ? { cols: 2, rows: 10, top: 122, pitch: 15, r: 5, cp: 13, lab: 16, gap: 12 }
                       : { cols: 2, rows: 15, top: 120, pitch: 10.2, r: 4.2, cp: 12, lab: 14, gap: 12 };
    const colW = T.lab + nChoices * T.cp, total = T.cols * colW + (T.cols - 1) * T.gap, right = SHEET_W / 2 + total / 2;
    const questions = [];
    for (let q = 0; q < nQ; q++) {
      const c = Math.floor(q / T.rows), row = q % T.rows, colRight = right - c * (colW + T.gap), y = T.top + row * T.pitch + T.pitch / 2;
      const bubbles = [];
      for (let k = 0; k < nChoices; k++) bubbles.push({ x: colRight - T.lab - k * T.cp - T.cp / 2, y });
      questions.push({ label: { x: colRight - T.lab / 2, y }, bubbles });
    }
    const idR = 4.4, idCp = 11.6, idTop = 60, idPitch = 11.8, idRight = 182;
    const idBubbles = [];
    for (let d = 0; d < ID_DIGITS; d++) {
      const row = [];
      for (let v = 0; v < 10; v++) row.push({ x: idRight - v * idCp - idCp / 2, y: idTop + d * idPitch + idPitch / 2 });
      idBubbles.push(row);
    }
    const verBubbles = [{ x: 39, y: idTop + 14 }, { x: 24, y: idTop + 14 }, { x: 39, y: idTop + 34 }, { x: 24, y: idTop + 34 }];
    return { fmt: 'quarter', tk: 'q' + (nQ <= 20 ? 20 : 30), T, r: T.r, questions, idBubbles, idR, verBubbles, verR: 4.6,
      idBox: { x1: 55, x2: idRight + 4, y1: idTop - 10, y2: idTop + ID_DIGITS * idPitch + 3 }, verBox: { x1: 14, x2: 49, y1: idTop - 10, y2: idTop + ID_DIGITS * idPitch + 3 } };
  }

  function layout(nQ, nChoices, fmt) {
    if (fmt === 'quarter') return layoutQuarter(Math.min(nQ, QMAX), nChoices);
    const tk = templateFor(nQ), T = TEMPLATES[tk];
    const colW = T.lab + nChoices * T.cp;
    const total = T.cols * colW + (T.cols - 1) * T.gap;
    const right = SHEET_W / 2 + total / 2;
    const questions = [];
    for (let q = 0; q < nQ; q++) {
      const c = Math.floor(q / T.rows), row = q % T.rows;
      const colRight = right - c * (colW + T.gap);
      const y = T.top + row * T.pitch + T.pitch / 2;
      const bubbles = [];
      for (let k = 0; k < nChoices; k++) bubbles.push({ x: colRight - T.lab - k * T.cp - T.cp / 2, y });
      questions.push({ label: { x: colRight - T.lab / 2, y }, bubbles });
    }
    // Student ID: 4 rows (digits, thousands first, top) x 10 columns (0..9 from right)
    const idR = 2.3, idCp = 6.2, idTop = 66, idPitch = 6.4, idRight = 196 - 12;
    const idBubbles = [];
    for (let d = 0; d < ID_DIGITS; d++) {
      const row = [];
      for (let v = 0; v < 10; v++) row.push({ x: idRight - v * idCp - idCp / 2, y: idTop + d * idPitch + idPitch / 2 });
      idBubbles.push(row);
    }
    // Version: 4 bubbles in a row on the left side
    const verBubbles = [];
    for (let v = 0; v < 4; v++) verBubbles.push({ x: 66 - v * 8, y: idTop + 1.5 * idPitch + idPitch / 2 });
    return { tk, T, r: T.r, questions, idBubbles, idR, verBubbles, verR: 2.6, idBox: { x1: idRight - 10 * idCp - 13, x2: idRight + 2, y1: idTop - 7, y2: idTop + ID_DIGITS * idPitch + 2 } };
  }

  // ---------- linear algebra ----------
  function solve(A, b) {
    const n = b.length;
    for (let i = 0; i < n; i++) {
      let p = i;
      for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
      [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
      if (Math.abs(A[i][i]) < 1e-12) return null;
      for (let r = i + 1; r < n; r++) {
        const f = A[r][i] / A[i][i];
        for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
        b[r] -= f * b[i];
      }
    }
    const x = new Array(n);
    for (let i = n - 1; i >= 0; i--) {
      let s = b[i];
      for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
      x[i] = s / A[i][i];
    }
    return x;
  }
  function homography(src, dst) { // maps src -> dst
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = src[i], [u, v] = dst[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
    }
    const h = solve(A, b);
    return h ? [...h, 1] : null;
  }
  function project(H, x, y) {
    const w = H[6] * x + H[7] * y + H[8];
    return [(H[0] * x + H[1] * y + H[2]) / w, (H[3] * x + H[4] * y + H[5]) / w];
  }

  // ---------- image helpers ----------
  function toGray(img) { // img: {width,height,data RGBA}
    const n = img.width * img.height, g = new Uint8Array(n), d = img.data;
    for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
    return { w: img.width, h: img.height, g };
  }
  function downscale(G, maxDim) {
    const s = Math.max(1, Math.ceil(Math.max(G.w, G.h) / maxDim));
    if (s === 1) return { ...G, s: 1 };
    const w = Math.floor(G.w / s), h = Math.floor(G.h / s), g = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let dy = 0; dy < s; dy++) { const row = (y * s + dy) * G.w + x * s; for (let dx = 0; dx < s; dx++) sum += G.g[row + dx]; }
      g[y * w + x] = sum / (s * s);
    }
    return { w, h, g, s };
  }
  function adaptiveBinary(S) { // 1 = dark
    const { w, h, g } = S, I = new Float64Array((w + 1) * (h + 1));
    for (let y = 0; y < h; y++) { let row = 0; for (let x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * (w + 1) + x + 1] = I[y * (w + 1) + x + 1] + row; } }
    const R = Math.max(8, Math.round(Math.max(w, h) / 14)), B = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - R), y1 = Math.min(h, y + R + 1);
      for (let x = 0; x < w; x++) {
        const x0 = Math.max(0, x - R), x1 = Math.min(w, x + R + 1);
        const sum = I[y1 * (w + 1) + x1] - I[y0 * (w + 1) + x1] - I[y1 * (w + 1) + x0] + I[y0 * (w + 1) + x0];
        const mean = sum / ((y1 - y0) * (x1 - x0));
        B[y * w + x] = g[y * w + x] < mean * 0.72 && g[y * w + x] < 150 ? 1 : 0;
      }
    }
    return B;
  }
  function components(B, w, h, minArea) {
    const lab = new Int32Array(w * h), out = [], stack = new Int32Array(w * h);
    let id = 0;
    for (let i = 0; i < w * h; i++) {
      if (!B[i] || lab[i]) continue;
      id++; let sp = 0; stack[sp++] = i; lab[i] = id;
      let n = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, x0 = w, x1 = 0, y0 = h, y1 = 0;
      while (sp) {
        const p = stack[--sp], x = p % w, y = (p / w) | 0;
        n++; sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && B[p - 1] && !lab[p - 1]) { lab[p - 1] = id; stack[sp++] = p - 1; }
        if (x < w - 1 && B[p + 1] && !lab[p + 1]) { lab[p + 1] = id; stack[sp++] = p + 1; }
        if (y > 0 && B[p - w] && !lab[p - w]) { lab[p - w] = id; stack[sp++] = p - w; }
        if (y < h - 1 && B[p + w] && !lab[p + w]) { lab[p + w] = id; stack[sp++] = p + w; }
      }
      if (n < minArea) continue;
      const cx = sx / n, cy = sy / n;
      const m20 = sxx / n - cx * cx, m02 = syy / n - cy * cy, m11 = sxy / n - cx * cy;
      const tr = m20 + m02, det = m20 * m02 - m11 * m11, disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
      const l1 = tr / 2 + disc, l2 = tr / 2 - disc;
      const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
      out.push({ n, cx, cy, bw, bh, fill: n / (bw * bh), I: tr / n, elong: l2 > 0 ? Math.sqrt(l1 / l2) : 99 });
    }
    return out;
  }
  function polyArea(p) { let a = 0; for (let i = 0; i < p.length; i++) { const j = (i + 1) % p.length; a += p[i][0] * p[j][1] - p[j][0] * p[i][1]; } return a / 2; }
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

  // sample mean gray in a disc of radius rr(mm) at sheet point
  function sampleDisc(G, H, x, y, rr, step) {
    let s = 0, n = 0;
    for (let dy = -rr; dy <= rr + 1e-9; dy += step) for (let dx = -rr; dx <= rr + 1e-9; dx += step) {
      if (dx * dx + dy * dy > rr * rr) continue;
      const [u, v] = project(H, x + dx, y + dy), ui = u | 0, vi = v | 0;
      if (ui < 0 || vi < 0 || ui >= G.w || vi >= G.h) return -1;
      s += G.g[vi * G.w + ui]; n++;
    }
    return n ? s / n : -1;
  }

  // ---------- detect 4 corner markers -> homography (sheet mm -> image px of G) ----------
  // spec: undefined = built-in sheet; otherwise a custom template spec (see tplSpec)
  function detect(G, spec) {
    const S = downscale(G, 720);
    const B = adaptiveBinary(S);
    const minArea = Math.max(8, (S.w * S.h) / (spec ? 20000 : 9000));
    let cands = components(B, S.w, S.h, minArea).filter(c =>
      c.fill > 0.45 && c.elong < 1.8 && c.I > 0.145 && c.I < 0.21 && c.bw / c.bh > 0.45 && c.bw / c.bh < 2.2);
    cands.sort((a, b) => b.n - a.n);
    cands = cands.slice(0, 18);
    if (cands.length < 4) return null;
    const ratio = spec ? spec.ratio : 269 / 182, mkRel = spec ? spec.mk / spec.short : 9 / 182;
    const quads = [];
    const N = cands.length;
    for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) for (let c = b + 1; c < N; c++) for (let d = c + 1; d < N; d++) {
      const q = [cands[a], cands[b], cands[c], cands[d]];
      const ns = q.map(o => o.n), mx = Math.max(...ns), mn = Math.min(...ns);
      if (mx / mn > 3.2) continue;
      const mxc = q.reduce((s, o) => s + o.cx, 0) / 4, myc = q.reduce((s, o) => s + o.cy, 0) / 4;
      q.sort((p1, p2) => Math.atan2(p1.cy - myc, p1.cx - mxc) - Math.atan2(p2.cy - myc, p2.cx - mxc));
      const P = q.map(o => [o.cx, o.cy]);
      const area = polyArea(P);
      if (area <= 0) continue;
      // convexity
      let convex = true;
      for (let i = 0; i < 4; i++) {
        const p0 = P[i], p1 = P[(i + 1) % 4], p2 = P[(i + 2) % 4];
        if ((p1[0] - p0[0]) * (p2[1] - p1[1]) - (p1[1] - p0[1]) * (p2[0] - p1[0]) <= 0) { convex = false; break; }
      }
      if (!convex) continue;
      const s0 = (dist(P[0], P[1]) + dist(P[2], P[3])) / 2, s1 = (dist(P[1], P[2]) + dist(P[3], P[0])) / 2;
      const rr = Math.max(s0, s1) / Math.min(s0, s1);
      if (rr < ratio / 1.45 || rr > ratio * 1.45) continue;
      // marker size consistent with quad size (marker 9mm vs short side 182mm)
      const expected = Math.pow(Math.min(s0, s1) * mkRel, 2);
      const meanN = ns.reduce((x, y) => x + y, 0) / 4;
      if (meanN < expected * 0.3 || meanN > expected * 2.6) continue;
      quads.push({ area, P, short01: s0 < s1 });
    }
    quads.sort((a, b) => b.area - a.area);
    for (const best of quads.slice(0, 6)) {
      const r = spec ? orientTpl(G, S, best, spec) : orient(G, S, best);
      if (r) return r;
    }
    return null;
  }

  function orient(G, S, best) {
    const sc = S.s;
    const P = best.P.map(([x, y]) => [(x + 0.5) * sc - 0.5, (y + 0.5) * sc - 0.5]);
    // cyclic order (clockwise in image coords). Choose start so P[s]->P[s+1] is a short side (top edge).
    const starts = best.short01 ? [0, 2] : [1, 3];
    let pick = null;
    for (const st of starts) {
      const dst = [0, 1, 2, 3].map(i => P[(st + i) % 4]);
      const H = homography(MARKERS, dst);
      if (!H) continue;
      const bar = sampleDisc(G, H, ORIENT_BAR.x + ORIENT_BAR.w / 2, ORIENT_BAR.y + ORIENT_BAR.h / 2, 3, 0.5);
      const opp = sampleDisc(G, H, ORIENT_BAR.x + ORIENT_BAR.w / 2, SHEET_H - ORIENT_BAR.y - ORIENT_BAR.h / 2, 3, 0.5);
      const paper = sampleDisc(G, H, 105, 22, 1.5, 0.5);
      if (bar < 0) continue;
      const score = (paper - bar) - Math.max(0, paper - opp);
      if (!pick || score > pick.score) pick = { H, score, corners: dst, barContrast: (paper - bar) / Math.max(1, paper) };
    }
    if (!pick || pick.barContrast < 0.25) return null;
    return refine(G, pick);
  }

  // ---------- custom templates ----------
  // t: {W, H, mk, thumb:{w,h,d:[]}}  (frame: marker centers at the 4 frame corners)

// ===== Minimal .xlsx writer (stored ZIP, inline strings, RTL sheets) =====
const XLSX = (() => {
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder();
  function zip(files) { // [{name, data:string}]
    const chunks = [], central = []; let off = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
      chunks.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + data.length;
    }
    const csize = central.reduce((s, a) => s + a.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
    return new Blob([...chunks, ...central, new Uint8Array(e.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  const x = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };
  // sheets: [{name, rows: [[cell]], widths:[n], header: true}] cell: string | number | null
  function build(sheets) {
    const files = [];
    files.push({ name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` });
    files.push({ name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` });
    files.push({ name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${x(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` });
    files.push({ name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F5F5B"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"><color rgb="FFD0D0D0"/></left><right style="thin"><color rgb="FFD0D0D0"/></right><top style="thin"><color rgb="FFD0D0D0"/></top><bottom style="thin"><color rgb="FFD0D0D0"/></bottom></border></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="4"><xf/><xf fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf borderId="1" applyBorder="1"><alignment horizontal="center"/></xf><xf numFmtId="164" borderId="1" applyNumberFormat="1" applyBorder="1"><alignment horizontal="center"/></xf></cellXfs></styleSheet>` });
    sheets.forEach((s, si) => {
      const rows = s.rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
        if (v == null || v === '') return '';
        const ref = col(ci) + (ri + 1), st = ri === 0 && s.header !== false ? 1 : (typeof v === 'number' && !Number.isInteger(v) ? 3 : 2);
        return typeof v === 'number' ? `<c r="${ref}" s="${st}"><v>${v}</v></c>` : `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`;
      }).join('')}</row>`).join('');
      const cols = s.widths ? `<cols>${s.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
      files.push({ name: `xl/worksheets/sheet${si + 1}.xml`, data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${rows}</sheetData></worksheet>` });
    });
    return zip(files);
  }
  return { build };
})();

  }
  load();
  const t = k => (I18N[db.settings.lang] || I18N.ar)[k] ?? I18N.ar[k] ?? k;
  const tf = (k, o) => t(k).replace(/\{(\w+)\}/g, (_, n) => o[n]);
  const labels = () => LABELS[db.settings.labels] || LABELS.ar;
  const N = n => db.settings.digits === 'ar' ? Sheet.toDigits(n, 'ar') : String(n);
  const fmt = (v, d = 1) => N((Math.round(v * 10 ** d) / 10 ** d).toString());
  const pc = (v, d = 0) => fmt(v, d) + (db.settings.digits === 'ar' ? '٪' : '%');
  const examById = id => db.exams.find(e => e.id === id);
  const classById = id => db.classes.find(c => c.id === id);
  const papersOf = id => (db.papers[id] ||= []);
  const tplById = id => db.templates.find(x => x.id === id);
  const isTpl = ex => typeof ex.fmt === 'string' && ex.fmt.startsWith('tpl:');
  const tplOf = ex => isTpl(ex) ? tplById(ex.fmt.slice(4)) : null;
  const tplQ = tp => (tp.blocks || []).reduce((a, b) => a + b.nQ, 0);
  // geometry used to scan an exam: built-in sheet or custom template
  const geomCache = new Map();
  function examGeom(ex) {
    const key = ex.fmt + '|' + ex.nQ + '|' + ex.nChoices + '|' + (tplOf(ex)?.v || 0);
    if (geomCache.has(key)) return geomCache.get(key);
    let g;
    const tp = tplOf(ex);
    if (tp) g = { spec: OMR.tplSpec(tp), L: OMR.tplLayout(tp, ex.nChoices) };
    else g = { spec: undefined, L: OMR.layout(ex.nQ, ex.nChoices, ex.fmt) };
    g.quad = g.spec ? g.spec.corners : [[9.5, 9.5], [200.5, 9.5], [200.5, 287.5], [9.5, 287.5]];
    geomCache.set(key, g); return g;
  }

  // ---------- grading ----------
  function mapOf(exam, v) {
    const m = exam.maps && exam.maps[v];
    return m && m.length === exam.nQ ? m : [...Array(exam.nQ).keys()];
  }
  function grade(exam, p) {
    const key = (exam.keys[p.version] || exam.keys[0] || []);
    let correct = 0, wrong = 0, blank = 0, multi = 0, scored = 0;
    const res = p.answers.map((a, i) => {
      const k = key[i] ?? -1;
      if (k < 0) return 'n';
      scored++;
      if (a === k) { correct++; return 'c'; }
      if (a === -1) { blank++; return 'b'; }
      if (a === -2) { multi++; return 'm'; }
      wrong++; return 'w';
    });
    const pct = scored ? correct / scored * 100 : 0;
    return { correct, wrong, blank, multi, scored, pct, score: pct / 100 * (exam.outOf || 100), res };
  }
  function studentName(exam, sid) {
    const c = classById(exam.classId);
    const s = c && c.students.find(s => String(s.id) === String(sid));
    return s ? s.name : null;
  }
  function stats(vals) {
    if (!vals.length) return null;
    const s = [...vals].sort((a, b) => a - b), n = s.length, mean = s.reduce((a, b) => a + b, 0) / n;
    const median = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
    const sd = Math.sqrt(s.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
    return { n, mean, median, sd, max: s[n - 1], min: s[0] };
  }
  function itemAnalysis(exam) {
    const papers = papersOf(exam.id).filter(p => p.version >= 0 && p.version < exam.nVersions);
    const graded = papers.map(p => ({ p, g: grade(exam, p) })).sort((a, b) => b.g.pct - a.g.pct);
    const k = Math.max(1, Math.round(graded.length * 0.27));
    const upper = new Set(graded.slice(0, k)), lower = new Set(graded.slice(-k));
    const items = [];
    for (let m = 0; m < exam.nQ; m++) {
      let n = 0, c = 0, nu = 0, cu = 0, nl = 0, cl = 0;
      const dist = new Array(exam.nChoices).fill(0); let blank = 0, multi = 0, key = null;
      for (const gp of graded) {
        const map = mapOf(exam, gp.p.version), j = map.indexOf(m);
        if (j < 0) continue;
        const kk = (exam.keys[gp.p.version] || [])[j] ?? -1;
        if (gp.p.version === 0 || key == null) key = kk;
        if (kk < 0) continue;
        const a = gp.p.answers[j], ok = a === kk;
        n++; if (ok) c++;
        if (a >= 0) dist[a]++; else if (a === -1) blank++; else multi++;
        if (upper.has(gp)) { nu++; if (ok) cu++; }
        if (lower.has(gp)) { nl++; if (ok) cl++; }
      }
      const p = n ? c / n : null, D = nu && nl ? cu / nu - cl / nl : null;
      let note = '';
      if (p != null) {
        if (D != null && D < 0 && graded.length >= 5) note = 'nNegDisc';
        else if (p < 0.3) note = 'nVeryHard';
        else if (p > 0.9) note = 'nVeryEasy';
        else if (D != null && D < 0.2 && graded.length >= 5) note = 'nLowDisc';
        else note = 'nGood';
      }
      items.push({ q: m, key, n, p, D, dist, blank, multi, note });
    }
    return { items, count: graded.length };
  }

      c.lineWidth = Math.max(2, fc.width / 400);

      <div class="panel form">
        <label>${esc(t('lang'))}<select id="s-lang">${opt('ar', S.lang, 'العربية')}${opt('ku', S.lang, 'کوردی (بادینی)')}</select></label>
        <label>${esc(t('labels'))}<select id="s-lab">${opt('ar', S.labels, 'أ ب ج د هـ')}${opt('en', S.labels, 'A B C D E')}${opt('num', S.labels, '1 2 3 4 5')}</select></label>
        <label>${esc(t('digits'))}<select id="s-dig">${opt('ar', S.digits, '١ ٢ ٣')}${opt('en', S.digits, '1 2 3')}</select></label>
      </div>
      <div class="panel"><div class="bar"><h3>${esc(t('tplTitle'))}</h3><label class="btn primary">+ ${esc(t('tplAdd'))}<input type="file" id="tpl-new" accept="image/*" hidden></label></div>
        <p class="hint">${esc(t('tplHelp'))}</p>
        ${db.templates.length ? `<div class="cards">${db.templates.map(tp => `<button class="card tpl" data-id="${tp.id}"><b>${esc(tp.name)}</b><span>${N(tplQ(tp))} ${esc(t('questions'))} · ${N(tp.nC)} ${esc(t('nChoices'))}</span></button>`).join('')}</div>` : `<div class="empty">${esc(t('tplNone'))}</div>`}</div>
      <div class="panel"><h3>${esc(t('backup'))}</h3><p class="hint">${esc(t('about'))}</p>
        <div class="actions"><button class="btn" id="exp">⬇ ${esc(t('exportJson'))}</button><label class="btn">⬆ ${esc(t('importJson'))}<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn danger" id="clr">${esc(t('clearAll'))}</button></div></div>`;
    el.querySelectorAll('.tpl').forEach(b => b.onclick = () => go('tplEdit', { id: b.dataset.id }));
    $('#tpl-new').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const im = await loadImage(f), sc = Math.min(1, 1600 / Math.max(im.width, im.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        go('tplEdit', { id: null, draft: { id: uid(), name: t('tplDefaultName') + ' ' + (db.templates.length + 1), img: cv.toDataURL('image/jpeg', 0.85), iw: cv.width, ih: cv.height, nC: 4, blocks: [], rScale: 1, v: 1 } });
      } catch (err) { toast('✕ ' + err.message, 'bad'); }
    };
    $('#s-lang').onchange = e => { S.lang = e.target.value; persist(); render(); };
    $('#s-lab').onchange = e => { S.labels = e.target.value; persist(); };
    $('#s-dig').onchange = e => { S.digits = e.target.value; persist(); };
    $('#exp').onclick = () => download(new Blob([JSON.stringify(db)], { type: 'application/json' }), 'musahhih-backup-' + new Date().toISOString().slice(0, 10) + '.json');
    $('#imp').onchange = async e => {
      try {
        const d = JSON.parse(await e.target.files[0].text());
        if (!d || !Array.isArray(d.exams) || !Array.isArray(d.classes)) throw new Error('format');
        if (!confirm(t('confirmDel'))) return;
        localStorage.setItem(KEY, JSON.stringify(d)); load(); toast('✓ ' + t('importOk')); render();
      } catch (err) { toast('✕ ' + err.message, 'bad'); }
    };
    $('#clr').onclick = () => { if (confirm(t('confirmDel'))) { localStorage.removeItem(KEY); load(); render(); } };
  }

  render();
  window.__app = { db: () => db, go, persist, grade, itemAnalysis, exportXlsx };
})();

</script>
</body>
</html>
